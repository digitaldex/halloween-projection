[project]
name = "halloween-projection"
version = "0.1.0"
description = "Halloween-Fensterprojektion – MQTT-gesteuerter Vollbild-Videoplayer (mpv) fuer Beamer am Raspberry Pi"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
